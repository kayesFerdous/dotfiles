unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-n

set -g mouse on

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g status-position top
set -g base-index 1
set -g renumber-windows on

# Projects: one session per repo. prefix+f = fuzzy project picker (sesh),
# prefix+s = tree of all projects/windows, prefix+L = last project.
bind f display-popup -E -w 60% -h 60% "{ sesh list -t; find ~/new_world ~/Documents ~/dotfiles -maxdepth 3 -name .git -exec dirname {} +; } 2>/dev/null | fzf --reverse --prompt 'project> ' | xargs -r sesh connect"
bind L run-shell "sesh last"

# Sidebar, like neo-tree: prefix+e show/hide everywhere, prefix+o jump in/out.
# Click = open project/window, right-click (or p inside) = pin. New windows get one while it's on.
set -goq @sidebar 1
bind e run-shell "~/.config/tmux/sidebar.py toggle #{pane_id}"
bind o run-shell "~/.config/tmux/sidebar.py focus #{pane_id}"
set-hook -g after-new-window 'if -F "#{@sidebar}" "run-shell -b \"~/.config/tmux/sidebar.py open #{window_id}\""'
set-hook -g session-created 'if -F "#{@sidebar}" "run-shell -b \"~/.config/tmux/sidebar.py open #{window_id}\""'
# Redraw sidebars right away when you move around instead of on their next tick.
set-hook -g session-window-changed 'run-shell -b "pkill -WINCH -f sidebar.py.run || true"'
set-hook -g client-session-changed 'run-shell -b "pkill -WINCH -f sidebar.py.run || true"'
set-hook -g client-attached 'run-shell -b "pkill -WINCH -f sidebar.py.run || true"'

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g status-style bg=default
